[package]
name = "culmen_highs"
description = "The HiGHS backend of culmen: every HiGHS callback as a typed, safe context, typed options and statuses."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Serialize and deserialize the HiGHS options and statuses.
serde = ["dep:serde", "culmen_core/serde"]

[dependencies]
# The program, the backend seam and the contexts this crate implements.
culmen_core.workspace = true
# HiGHS's C API and HiGHS itself, built from its bundled sources; the workspace entry says how.
highs-sys.workspace = true
# The serde impls of the options and statuses, behind `serde`.
serde = { workspace = true, optional = true }

[dev-dependencies]
# The exact reference solver, the strategies, the hard instances and the recording backend the tests use.
culmen_testing.workspace = true
# Property tests against the reference.
proptest.workspace = true
# The serde round trips run through JSON.
serde_json.workspace = true

# docs.rs documents the serde impls of the options and statuses too.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
