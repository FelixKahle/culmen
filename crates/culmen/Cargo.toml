[package]
name = "culmen"
description = "Linear, mixed-integer and convex quadratic programming: models that read like the mathematics, a switchable backend, live observation and a cooperative stop."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["highs"]
# The HiGHS backend, `culmen::highs`; builds HiGHS from source with cmake.
highs = ["dep:culmen_highs"]
# The SCIP backend, `culmen::scip`; downloads the SCIP sources from GitHub and builds SCIP and SoPlex with cmake, a
# long first build, so it is not a default feature.
scip = ["dep:culmen_scip"]
# The modelling macros `variable!`, `constraint!`, `objective!` and `sum!`.
macros = ["dep:culmen_macros"]
# Serialize and deserialize the plain data, and the options and statuses of each backend enabled.
serde = ["culmen_core/serde", "culmen_highs?/serde", "culmen_scip?/serde"]

[dependencies]
# The program, the modelling layer and the solve API, re-exported at the root.
culmen_core.workspace = true
# The HiGHS backend, behind `highs`.
culmen_highs = { workspace = true, optional = true }
# The modelling macros, behind `macros`.
culmen_macros = { workspace = true, optional = true }
# The SCIP backend, behind `scip`.
culmen_scip = { workspace = true, optional = true }

[dev-dependencies]
# The exact reference solver the guide's testing page shows.
culmen_testing.workspace = true
# Ctrl-C in the warehouse example.
ctrlc.workspace = true

[[example]]
name = "knapsack"
required-features = ["highs"]

[[example]]
name = "knapsack_macros"
required-features = ["highs", "macros"]

[[example]]
name = "warehouse"
required-features = ["highs"]

[[example]]
name = "cutting_planes"
required-features = ["highs"]

[[example]]
name = "column_generation"
required-features = ["highs"]

[[example]]
name = "warehouse_macros"
required-features = ["highs", "macros"]

[[example]]
name = "branch_and_price"
required-features = ["scip"]

[[example]]
name = "lazy_constraints"
required-features = ["scip"]

# docs.rs documents every feature, so both backends, the macros and the serde impls appear in the API docs.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
