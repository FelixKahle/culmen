[package]
name = "culmen_scip"
description = "The SCIP backend of culmen: SCIP built from source through scip-sys, with typed settings and statuses."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Serialize and deserialize the SCIP options, statuses and version.
serde = ["dep:serde", "culmen_core/serde"]

[dependencies]
culmen_core.workspace = true
scip-sys.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
culmen_testing.workspace = true
proptest.workspace = true
serde_json.workspace = true

# docs.rs documents the serde impls of the statuses too.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
