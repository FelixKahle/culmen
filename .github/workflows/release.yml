# Pushing a tag `vX.Y.Z` on a commit of main publishes every crate of the workspace to crates.io. The job runs in the
# `release` environment and authenticates by Trusted Publishing: crates.io trusts this workflow in this repository and
# hands it a token that lasts for the job, so no token is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The workspace's `rust-version`; the release builds with exactly that toolchain.
  RUST_TOOLCHAIN: "1.99"

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # The OIDC identity token crates.io's Trusted Publishing checks.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history, so the check below can see whether the tagged commit is on main.
          fetch-depth: 0
      - name: Check the tag names a commit of main and the workspace's version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "culmen") | .version')
          test "$GITHUB_REF_NAME" = "v$version" \
            || { echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"; exit 1; }
      # highs-sys and scip-sys compile HiGHS, SCIP and SoPlex with cmake and generate their bindings with libclang;
      # scip-sys downloads SCIP's sources from github.com as it builds, which the semver check and the publish
      # verification below both do.
      - name: Install cmake and libclang
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Refuses the release when a crate's public API breaks in a way its version bump does not allow (for 0.x, a
      # breaking change needs a minor bump), comparing each publishable crate with its latest release on crates.io.
      # It runs before the crates.io token is requested, so a refused release never holds one.
      - name: Check semver against crates.io
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # The pinned toolchain installed above, not the action's own stable.
          rust-toolchain: manual
          # culmen_testing is never published, so it has no release to compare with.
          exclude: culmen_testing
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The crates are published one by one in dependency order: culmen_core, then culmen_highs, culmen_macros and
      # culmen_scip, then culmen, which depends on all four. Cargo verifies that each one builds from its package and
      # waits until crates.io lists it before the next starts. culmen_testing is `publish = false` and left out.
      #
      # A crate whose version crates.io already lists is skipped, so the job can be run again after it stopped
      # halfway, and a crate's first release, which crates.io accepts only from its owner's own token because a
      # trusted publisher can be set up only for a crate that exists, can be published by hand before the tag.
      - name: Publish
        run: |
          crates="culmen_core culmen_highs culmen_macros culmen_scip culmen"
          metadata=$(cargo metadata --no-deps --format-version 1)
          # The list above must be exactly the publishable members, so a new crate cannot be forgotten here.
          publishable=$(jq -r '[.packages[] | select(.publish == null) | .name] | sort | join(" ")' <<<"$metadata")
          listed=$(tr ' ' '\n' <<<"$crates" | sort | tr '\n' ' ' | sed 's/ $//')
          test "$listed" = "$publishable" \
            || { echo "::error::the publish list ($listed) is not the publishable crates ($publishable)"; exit 1; }
          version=$(jq -r '.packages[] | select(.name == "culmen") | .version' <<<"$metadata")
          for crate in $crates; do
            # The sparse index holds one JSON line per published version; every name here is longer than three
            # characters, so its file is at <first two>/<next two>/<name>.
            url="https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate"
            status=$(curl --silent --show-error --output index.jsonl --write-out '%{http_code}' "$url")
            case "$status" in
              200) published=$(jq -r --arg v "$version" 'select(.vers == $v) | .vers' index.jsonl) ;;
              404) published="" ;;
              *) echo "::error::crates.io's index answered $status for $crate"; exit 1 ;;
            esac
            if [ -n "$published" ]; then
              echo "$crate $version is already on crates.io; skipped"
            else
              cargo publish --package "$crate"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
