# Dependabot keeps the workflows' actions and the workspace's crates current. Each ecosystem opens at most one pull
# request a week, grouping every update into it, so CI runs once over the whole batch instead of once per crate.
version: 2

updates:
  # The actions the workflows use (`actions/checkout`, `Swatinem/rust-cache`, ...). Their major versions are pinned
  # in the workflows, so these updates are mostly new majors.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # The workspace's crates.io dependencies, from the root manifest and Cargo.lock. Lockfile-only bumps within the
  # declared requirements and requirement bumps both land in the one weekly pull request.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      cargo:
        patterns: ["*"]
