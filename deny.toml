# cargo-deny's policy for the dependency tree: no crate with a known advisory, only the licences below, only crates
# from crates.io. CI runs `cargo deny check` on every pull request and every push to main.
#
# The graph is checked for every target, not only Linux, because users build culmen on every platform and a
# platform-only dependency is shipped to them all the same.

[graph]
# Every feature of the workspace's crates, so a dependency behind an optional feature (`serde`, `highs`, `scip`,
# `macros`) is checked as well.
all-features = true

[advisories]
# A crate the RustSec database marks yanked fails the check rather than warning: a release must not depend on one.
yanked = "deny"
# Advisories against build dependencies of scip-sys 0.1.28, the latest release, which pins them. Its `from-source`
# feature, which culmen_scip uses, lists `zip` 0.5, `zip-extract`, `ureq`, `flate2` and `tar` together, so cargo
# compiles all of them into scip-sys's build script; but that path downloads the SCIP sources as a `.tgz` and unpacks
# them with `flate2` and `tar` (`download_and_extract_tar_gz`). `zip` and `zip-extract`, with zip 0.5's `time` 0.1 and
# zip 0.6's `zstd-safe`, `zstd-sys` and `constant_time_eq`, serve only `download_and_extract_zip`, which only the
# `bundled` feature calls: they are compiled into the build script and never run, and none of them is linked into a
# binary that depends on culmen. Each ignore below is still matched by the tree (cargo-deny warns about one that is
# not). The fix is upstream: once scip-sys moves `zip` and `zip-extract` out of `from-source`, every entry here goes.
ignore = [
    { id = "RUSTSEC-2020-0071", reason = "time 0.1.45 under zip 0.5.13: compiled into scip-sys's build script, never run; see above" },
    { id = "RUSTSEC-2025-0172", reason = "zip-extract 0.1.3, unmaintained: compiled into scip-sys's build script, never run; see above" },
    { id = "RUSTSEC-2026-0367", reason = "zip 0.5.13 and 0.6.6: compiled into scip-sys's build script, never run; see above" },
    { id = "RUSTSEC-2026-0368", reason = "zip 0.5.13 and 0.6.6: compiled into scip-sys's build script, never run; see above" },
    { id = "RUSTSEC-2026-0369", reason = "zip 0.5.13 and 0.6.6: compiled into scip-sys's build script, never run; see above" },
    { id = "RUSTSEC-2026-0429", reason = "zip 0.5.13 and 0.6.6: compiled into scip-sys's build script, never run; see above" },
    { id = "RUSTSEC-2026-0545", reason = "zip 0.6.6: compiled into scip-sys's build script, never run; see above" },
    { id = "RUSTSEC-2026-0548", reason = "zip 0.5.13 and 0.6.6: compiled into scip-sys's build script, never run; see above" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 5.0.2 under zip 0.6.6: compiled into scip-sys's build script, never run; see above" },
]

[licenses]
# Exactly the licences the current tree needs. A crate offering a choice (`MIT OR Apache-2.0`) needs only one of them.
#   MIT, Apache-2.0  most of the tree, and culmen itself
#   BSD-3-Clause     bindgen, which generates the HiGHS and SCIP bindings at build time
#   ISC              libloading, through clang-sys
#   Unicode-3.0      unicode-ident's Unicode data tables
# A new licence is added here only after reading it, so a dependency update cannot bring one in unnoticed.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0"]
# Three more licences, each allowed for the one crate version in the lock that needs it, so a new version needs a
# fresh read. All are build dependencies of scip-sys, compiled into its build script and not linked into a binary.
# Each was read: permissive, without a copyleft term.
#   CC0-1.0              constant_time_eq 0.1.5, under zip 0.6: compiled, never run (see the advisories above)
#   CDLA-Permissive-2.0  webpki-roots 0.26.11 and 1.0.12, the certificate roots of ureq, which downloads the sources
#   BSD-2-Clause         zstd-sys 2.1.3, beside BSD-3-Clause, under zip 0.6: compiled, never run
exceptions = [
    { allow = ["CC0-1.0"], crate = "constant_time_eq@0.1.5" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@0.26.11" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.12" },
    { allow = ["BSD-2-Clause"], crate = "zstd-sys@2.1.3+zstd.1.5.7" },
]
# The bar a licence text must clear for cargo-deny to recognise it from the file instead of the manifest's SPDX
# expression; 0.93 is the documented recommendation, stricter than the 0.8 default.
confidence-threshold = 0.93

[licenses.private]
# culmen_testing is `publish = false` and carries the workspace licence; it is checked like any published crate
# rather than skipped.
ignore = false

[bans]
# Two versions of one crate are reported but do not fail the check: they cost build time, not correctness, and are
# often outside the workspace's control until an upstream crate updates.
multiple-versions = "warn"
# A `*` version requirement would let any release in, including a breaking one.
wildcards = "deny"
# The workspace's own path dependencies carry a version for crates.io, but culmen_testing is path-only by design
# (it is never published), so path dependencies are exempt from the wildcard rule.
allow-wildcard-paths = true

[sources]
# Only crates.io: no git dependency and no other registry, since crates.io refuses to publish a crate that depends on
# either.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
