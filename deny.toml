# cargo-deny's policy for the dependency tree: no crate with a known advisory, only the licences below, only crates
# from crates.io. CI runs `cargo deny check` on every pull request and every push to main.
#
# The graph is checked for every target, not only Linux, because users build culmen on every platform and a
# platform-only dependency is shipped to them all the same.

[graph]
# Every feature of the workspace's crates, so a dependency behind an optional feature (`serde`, `highs`, `scip`,
# `macros`) is checked as well.
all-features = true

[advisories]
# A crate the RustSec database marks yanked fails the check rather than warning: a release must not depend on one.
yanked = "deny"
# Advisories against build dependencies of scip-sys 0.1.28, the latest release, which pins them: its build script
# downloads the SCIP Optimization Suite sources over HTTPS from github.com and unpacks them, and these crates do the
# unpacking (`zip`, `zip-extract`, `zstd-safe`, and `time` 0.1 under `zip` 0.5). None of them is linked into a binary
# that depends on culmen; they run once, at build time, on that one archive. Each advisory is about unpacking or
# decompressing a crafted archive, or, for `time`, reading the local time while another thread changes the
# environment, which the build script does not do. Whoever could replace the archive could put any C code into the
# build in any case, so the advisories add nothing to trusting the download. Remove these entries when scip-sys
# updates or drops these dependencies; `cargo deny check advisories` then passes without them.
ignore = [
    { id = "RUSTSEC-2020-0071", reason = "time 0.1, a build dependency of scip-sys through zip 0.5; see above" },
    { id = "RUSTSEC-2025-0172", reason = "zip-extract, unmaintained, a build dependency of scip-sys; see above" },
    { id = "RUSTSEC-2026-0367", reason = "zip 0.5 and 0.6, build dependencies of scip-sys; see above" },
    { id = "RUSTSEC-2026-0368", reason = "zip 0.5 and 0.6, build dependencies of scip-sys; see above" },
    { id = "RUSTSEC-2026-0369", reason = "zip 0.5 and 0.6, build dependencies of scip-sys; see above" },
    { id = "RUSTSEC-2026-0429", reason = "zip 0.5 and 0.6, build dependencies of scip-sys; see above" },
    { id = "RUSTSEC-2026-0545", reason = "zip 0.6, a build dependency of scip-sys; see above" },
    { id = "RUSTSEC-2026-0548", reason = "zip 0.5 and 0.6, build dependencies of scip-sys; see above" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 5, a build dependency of scip-sys through zip 0.6; see above" },
]

[licenses]
# Exactly the licences the current tree needs. A crate offering a choice (`MIT OR Apache-2.0`) needs only one of them.
#   MIT, Apache-2.0  most of the tree, and culmen itself
#   BSD-3-Clause     bindgen, which generates the HiGHS and SCIP bindings at build time
#   ISC              libloading, through clang-sys
#   Unicode-3.0      unicode-ident's Unicode data tables
# A new licence is added here only after reading it, so a dependency update cannot bring one in unnoticed.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0"]
# Three more licences, each allowed for the one crate that needs it, all build dependencies of scip-sys that download
# and unpack the SCIP sources and are not linked into a binary. Each was read: permissive, without a copyleft term.
#   CC0-1.0              constant_time_eq 0.1, under zip 0.6
#   CDLA-Permissive-2.0  webpki-roots 0.26 and 1.0, the certificate roots of ureq, which downloads the sources
#   BSD-2-Clause         zstd-sys, beside BSD-3-Clause, under zip 0.6
exceptions = [
    { allow = ["CC0-1.0"], crate = "constant_time_eq" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["BSD-2-Clause"], crate = "zstd-sys" },
]
# The bar a licence text must clear for cargo-deny to recognise it from the file instead of the manifest's SPDX
# expression; 0.93 is the documented recommendation, stricter than the 0.8 default.
confidence-threshold = 0.93

[licenses.private]
# culmen_testing is `publish = false` and carries the workspace licence; it is checked like any published crate
# rather than skipped.
ignore = false

[bans]
# Two versions of one crate are reported but do not fail the check: they cost build time, not correctness, and are
# often outside the workspace's control until an upstream crate updates.
multiple-versions = "warn"
# A `*` version requirement would let any release in, including a breaking one.
wildcards = "deny"
# The workspace's own path dependencies carry a version for crates.io, but culmen_testing is path-only by design
# (it is never published), so path dependencies are exempt from the wildcard rule.
allow-wildcard-paths = true

[sources]
# Only crates.io: no git dependency and no other registry, since crates.io refuses to publish a crate that depends on
# either.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
